name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'preview/**'
  pull_request:
    branches:
      - main
      - 'preview/**'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript (Backend)
        run: npm --prefix server run check

      - name: Build Frontend
        run: npm run build

      - name: Run Test Suite
        run: npm test
