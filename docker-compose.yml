services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: vitstock_hub
    ports:
      - "5432:5432"
    volumes:
      - vitstock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitstock -d vitstock_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitstock_postgres_data:
