services:
  postgres:
    image: postgres:16-alpine
    restart: 'no'
    environment:
      POSTGRES_USER: vitstock
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: vitstock_qa
    ports:
      - "55432:5432"
    volumes:
      - vitstock_qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitstock -d vitstock_qa"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  vitstock_qa_postgres_data:
